<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="JetBrains Mono, SF Mono, Menlo, monospace">
  <rect width="800" height="600" rx="18" fill="#17212B"/>
  <circle cx="34" cy="30" r="6" fill="#3A434C"/><circle cx="56" cy="30" r="6" fill="#3A434C"/><circle cx="78" cy="30" r="6" fill="#3A434C"/>
  <text x="400" y="35" text-anchor="middle" font-size="14" fill="#5A6570">chat-db · streamlit</text>
  <g font-size="19" fill="#A3ACB4">
    <text x="60" y="120" fill="#8FA8FF">you</text>
    <text x="60" y="152" fill="#EDEFEA">Which customers ordered more than 5 times</text>
    <text x="60" y="182" fill="#EDEFEA">last quarter, sorted by total spend?</text>
  </g>
  <rect x="60" y="230" width="680" height="220" rx="12" fill="#1E252D" stroke="#2A323A"/>
  <text x="84" y="266" font-size="14" fill="#5A6570">gemini → mysql</text>
  <g font-size="19">
    <text x="84" y="306" fill="#8FA8FF">SELECT</text><text x="176" y="306" fill="#EDEFEA">c.name, SUM(o.total) AS spend</text>
    <text x="84" y="336" fill="#8FA8FF">FROM</text><text x="152" y="336" fill="#EDEFEA">customers c JOIN orders o ON o.cid = c.id</text>
    <text x="84" y="366" fill="#8FA8FF">WHERE</text><text x="164" y="366" fill="#EDEFEA">o.placed_at &gt;= '2025-01-01'</text>
    <text x="84" y="396" fill="#8FA8FF">GROUP BY</text><text x="198" y="396" fill="#EDEFEA">c.id</text><text x="260" y="396" fill="#8FA8FF">HAVING</text><text x="346" y="396" fill="#EDEFEA">COUNT(*) &gt; 5</text>
    <text x="84" y="426" fill="#8FA8FF">ORDER BY</text><text x="198" y="426" fill="#EDEFEA">spend DESC;</text>
  </g>
  <rect x="60" y="490" width="120" height="40" rx="20" fill="#3056D3"/>
  <text x="120" y="515" text-anchor="middle" font-size="15" fill="#FFFFFF">Run query</text>
  <text x="200" y="515" font-size="15" fill="#5A6570">~60% faster than writing it by hand</text>
</svg>
