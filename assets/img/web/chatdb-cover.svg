<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Atkinson Hyperlegible Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <radialGradient id="glow" cx="82%" cy="-10%" r="95%">
      <stop offset="0" stop-color="#3056D3" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3056D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2640"/>
      <stop offset="1" stop-color="#141D31"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0D1424"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- app window -->
  <rect x="40" y="34" width="720" height="432" rx="14" fill="url(#win)" stroke="#2A3550"/>
  <circle cx="66" cy="57" r="5.5" fill="#2E3A57"/><circle cx="86" cy="57" r="5.5" fill="#2E3A57"/><circle cx="106" cy="57" r="5.5" fill="#2E3A57"/>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#7F8AA3">chat-db / streamlit</text>
  <line x1="40.5" y1="80" x2="759.5" y2="80" stroke="#22304D"/>

  <!-- the question -->
  <text x="72" y="116" font-size="14" fill="#A0B1FF">you</text>
  <text x="72" y="144" font-size="18" fill="#ECE9E1">Which customers ordered more than 5 times</text>
  <text x="72" y="170" font-size="18" fill="#ECE9E1">this year, sorted by total spend?</text>

  <!-- the generated query, reviewed before it runs -->
  <rect x="72" y="196" width="656" height="188" rx="10" fill="#0D1424" stroke="#2A3550"/>
  <text x="92" y="224" font-size="12.5" fill="#7F8AA3">gemini → mysql, review before run</text>
  <g font-size="17" fill="#DCDFE8">
    <text x="92" y="256"><tspan fill="#7C93FF">SELECT</tspan> c.name, SUM(o.total) AS spend</text>
    <text x="92" y="282"><tspan fill="#7C93FF">FROM</tspan> customers c JOIN orders o ON o.cid = c.id</text>
    <text x="92" y="308"><tspan fill="#7C93FF">WHERE</tspan> o.placed_at &gt;= '2025-01-01'</text>
    <text x="92" y="334"><tspan fill="#7C93FF">GROUP BY</tspan> c.id <tspan fill="#7C93FF">HAVING</tspan> COUNT(*) &gt; 5</text>
    <text x="92" y="360"><tspan fill="#7C93FF">ORDER BY</tspan> spend <tspan fill="#7C93FF">DESC</tspan>;</text>
  </g>

  <!-- detector lock on the query: the site's motif -->
  <g stroke="#7C93FF" stroke-width="2" fill="none" stroke-linecap="square">
    <path d="M64 206 V188 H82"/><path d="M718 188 H736 V206"/>
    <path d="M736 374 V392 H718"/><path d="M82 392 H64 V374"/>
  </g>
  <rect x="592" y="176" width="112" height="22" rx="6" fill="#0B1222" stroke="#3A4C82"/>
  <rect x="601" y="185" width="5" height="5" rx="1" fill="#7C93FF"/>
  <text x="612" y="192" font-size="12" fill="#ECE9E1">sql 0.92</text>

  <!-- run -->
  <rect x="72" y="408" width="128" height="38" rx="10" fill="#7C93FF"/>
  <text x="136" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#0D1424">Run query</text>
  <text x="218" y="432" font-size="13.5" fill="#A3ADC2">~60% faster than writing it by hand</text>
</svg>
